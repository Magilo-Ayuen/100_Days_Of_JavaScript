        //  ------------- ACCUMULATOR PATTERN -------------

       /* 1. Create a variable to store the results of accumulating eg add arrays 
          2. Loop through the arrays and update the results
       */

       const nums = [45,67,11];
       let sum = 0; //accumulator variable

       for (let i = 0 ; i < nums.length ; i++) {
